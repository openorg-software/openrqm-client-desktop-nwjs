[package]
name = "openrqm-client"
version = "0.0.1"
description = "OpenRQM Desktop Client"
authors = ["OpenRQM Contributors"]
license = "GPL-2.0-only"
repository = "https://github.com/openrqm/openrqm-client-desktop-nwjs"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
