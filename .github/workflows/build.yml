# openrqm-client-desktop-nwjs
# GitHub Actions workflow for building and releasing the openrqm client
# SPDX-License-Identifier: GPL-2.0-only
# Copyright (C) 2019 - 2026 Benjamin Schilling

name: Build and Release

on:
  push:
    branches:
      - master
      - development

jobs:
  build-tauri:
    name: Build Tauri App
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm install

      - name: Build Angular frontend
        run: npm run build

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "tag=release" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_tag.outputs.tag }}
          releaseName: OpenRQM Client ${{ steps.release_tag.outputs.tag }}
          releaseBody: |
            See the changelog for details.
          releaseDraft: false
          prerelease: ${{ steps.release_tag.outputs.prerelease }}
          updaterJsonKeepUniversal: true

  docs:
    name: Build and publish documentation PDFs
    runs-on: ubuntu-latest
    needs: build-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive

      - name: Install pandoc-plantuml filter
        run: npm install -g pandoc-plantuml

      - name: Convert documentation to PDF
        run: |
          pandoc -F pandoc-plantuml -o README.pdf README.md
          pandoc -F pandoc-plantuml -o ARCHITECTURE.pdf doc/ARCHITECTURE.md
          pandoc -F pandoc-plantuml -o WIREFRAME.pdf doc/WIREFRAME.md

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "tag=release" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload PDF documentation to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            README.pdf
            ARCHITECTURE.pdf
            WIREFRAME.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
