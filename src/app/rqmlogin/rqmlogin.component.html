<ix-application-header name="OpenRQM">
  <div slot="logo"><img src="assets/img/logo_transparent.png"></div>
  <ix-button id="loginSettingsMenuTrigger" variant="subtle-primary">Settings</ix-button>
  <ix-dropdown trigger="loginSettingsMenuTrigger">
    <ix-dropdown-item label="Server" (click)="openDialogServerSettings()"></ix-dropdown-item>
  </ix-dropdown>
</ix-application-header>

<form class="login-container">
  <div class="mb-3 login-input-container">
    <label class="form-label">E-Mail</label>
    <input class="form-control" autocomplete="email" #emailLogin>
  </div>
  <div class="mb-3 login-input-container">
    <label class="form-label">Password</label>
    <input type="password" autocomplete="current-password" class="form-control" #passwordLogin>
  </div>
  <div class="login-button-container"><ix-button class="login-button" (click)="login()">Login</ix-button></div>
  <div class="login-button-container"><ix-button class="login-button" variant="subtle-primary" (click)="openDialogRegister()">Register</ix-button></div>
</form>
