<p>Users</p>

<div>
  <table class="table">
    <thead>
      <tr>
        <th>
          <input *ngIf="initialized" type="checkbox" (change)="masterToggle()" [checked]="isAllSelected()" [indeterminate]="selectedItems.size > 0 && !isAllSelected()">
        </th>
        <th>User</th>
        <th>Permissions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let element of pagedData" (click)="toggleSelection(element)">
        <td>
          <input *ngIf="initialized" type="checkbox" (click)="$event.stopPropagation()" (change)="toggleSelection(element)" [checked]="selectedItems.has(element)">
        </td>
        <td>{{element.userId}}</td>
        <td>{{element.permissions}}</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td><ix-button (click)="openAddUser()">Add</ix-button></td>
        <td><ix-button (click)="deleteUser()">Delete</ix-button></td>
        <td></td>
      </tr>
    </tfoot>
  </table>
  <div class="d-flex justify-content-between align-items-center mt-2">
    <select class="form-select" style="width: auto;" [(ngModel)]="pageSize" (ngModelChange)="updatePage()">
      <option [ngValue]="5">5</option>
      <option [ngValue]="10">10</option>
      <option [ngValue]="20">20</option>
    </select>
    <div>
      <ix-button variant="subtle-primary" [disabled]="currentPage === 0" (click)="currentPage = 0; updatePage()">First</ix-button>
      <ix-button variant="subtle-primary" [disabled]="currentPage === 0" (click)="currentPage = currentPage - 1; updatePage()">Prev</ix-button>
      <span class="mx-2">Page {{currentPage + 1}} of {{totalPages}}</span>
      <ix-button variant="subtle-primary" [disabled]="currentPage >= totalPages - 1" (click)="currentPage = currentPage + 1; updatePage()">Next</ix-button>
      <ix-button variant="subtle-primary" [disabled]="currentPage >= totalPages - 1" (click)="currentPage = totalPages - 1; updatePage()">Last</ix-button>
    </div>
  </div>
</div>
