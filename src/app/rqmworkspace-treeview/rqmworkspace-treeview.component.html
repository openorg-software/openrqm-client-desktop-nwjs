<ng-container *ngIf="items">
  <ng-container *ngTemplateOutlet="treeNode; context: { items: items }"></ng-container>
</ng-container>

<ng-template #treeNode let-items="items">
  <ul class="treeview-list">
    <li *ngFor="let item of items" class="treeview-item">
      <div class="form-inline row-item" (contextmenu)="onContextMenu($event, item)">
        <fa-icon *ngIf="item.children" aria-hidden="true" [icon]="item.collapsed ? faFolder : faFolderOpen"
          (click)="toggleCollapse(item)"></fa-icon>
        <fa-icon *ngIf="item.isItemDocument()" [icon]="faFile"></fa-icon>
        <fa-icon *ngIf="!item.isItemDocument() && !item.children" [icon]="faFolderRegular"></fa-icon>
        <label class="form-check-label" (click)="select(item)">{{ item.text }}</label>
      </div>
      <ng-container *ngIf="item.children && !item.collapsed">
        <ng-container *ngTemplateOutlet="treeNode; context: { items: item.children }"></ng-container>
      </ng-container>
    </li>
  </ul>
</ng-template>

<ix-dropdown *ngIf="contextMenuVisible" [show]="contextMenuVisible" [style.left]="contextMenuPosition.x" [style.top]="contextMenuPosition.y" style="position: fixed;" (showChanged)="contextMenuVisible = $event">
  <ix-dropdown-item *ngIf="tempTreeViewItem?.isItemWorkspace()" label="Add Workspace" (click)="openDialogNewWorkspace(tempTreeViewItem)"></ix-dropdown-item>
  <ix-dropdown-item *ngIf="tempTreeViewItem?.isItemWorkspace()" label="Add Document" (click)="openDialogAddDocument(tempTreeViewItem)"></ix-dropdown-item>
  <ix-dropdown-item *ngIf="tempTreeViewItem?.isItemWorkspace()" label="Import Document from Disk" (click)="openDialogImportDocument(tempTreeViewItem)"></ix-dropdown-item>
  <ix-dropdown-item label="Properties" (click)="openWorkspaceItemProperties(tempTreeViewItem)"></ix-dropdown-item>
  <ix-dropdown-item *ngIf="tempTreeViewItem?.isItemWorkspace()" label="Delete Workspace" (click)="openDialogDelete(tempTreeViewItem)"></ix-dropdown-item>
  <ix-dropdown-item *ngIf="tempTreeViewItem?.isItemDocument()" label="Delete Document" (click)="openDialogDelete(tempTreeViewItem)"></ix-dropdown-item>
</ix-dropdown>
