<ng-container *ngIf="items">
  <ng-container *ngTemplateOutlet="treeNode; context: { items: items }"></ng-container>
</ng-container>

<ng-template #treeNode let-items="items">
  <ul class="treeview-list">
    <li *ngFor="let item of items" class="treeview-item">
      <div class="form-inline row-item" (contextmenu)="onContextMenu($event, item)">
        <fa-icon *ngIf="item.children" aria-hidden="true" [icon]="item.collapsed ? faFolder : faFolderOpen"
          (click)="toggleCollapse(item)"></fa-icon>
        <fa-icon *ngIf="item.isItemDocument()" [icon]="faFile"></fa-icon>
        <fa-icon *ngIf="!item.isItemDocument() && !item.children" [icon]="faFolderRegular"></fa-icon>
        <label class="form-check-label" (click)="select(item)">{{ item.text }}</label>
        <div style="visibility: hidden; position: fixed" [style.left]="contextMenuPosition.x"
          [style.top]="contextMenuPosition.y" [matMenuTriggerFor]="contextMenu">
        </div>
        <mat-menu #contextMenu="matMenu">
          <ng-template matMenuContent let-item="item">
            <button mat-menu-item *ngIf="item.isItemWorkspace()" (click)="openDialogNewWorkspace(item)">Add Workspace</button>
            <button mat-menu-item *ngIf="item.isItemWorkspace()" (click)="openDialogAddDocument(item)">Add Document</button>
            <button mat-menu-item *ngIf="item.isItemWorkspace()" (click)="openDialogImportDocument(item)">Import Document from Disk</button>
            <button mat-menu-item (click)="openWorkspaceItemProperties(item)">Properties</button>
            <button mat-menu-item *ngIf="item.isItemWorkspace()" (click)="openDialogDelete(item)">Delete Workspace</button>
            <button mat-menu-item *ngIf="item.isItemDocument()" (click)="openDialogDelete(item)">Delete Document</button>
          </ng-template>
        </mat-menu>
      </div>
      <ng-container *ngIf="item.children && !item.collapsed">
        <ng-container *ngTemplateOutlet="treeNode; context: { items: item.children }"></ng-container>
      </ng-container>
    </li>
  </ul>
</ng-template>
