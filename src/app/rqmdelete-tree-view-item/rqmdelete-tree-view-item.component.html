<ix-modal-header *ngIf="item.isItemDocument()">Delete Document</ix-modal-header>
<ix-modal-header *ngIf="item.isItemWorkspace()">Delete Workspace</ix-modal-header>

<ix-modal-content>
  <p>Do you really want to delete this object?</p>
</ix-modal-content>

<ix-modal-footer>
  <ix-button variant="subtle-primary" (click)="activeModal.dismiss('cancel')">Cancel</ix-button>
  <ix-button *ngIf="item.isItemDocument()" (click)="deleteDocument(); activeModal.close('ok')">Confirm</ix-button>
  <ix-button *ngIf="item.isItemWorkspace()" (click)="deleteWorkspace(); activeModal.close('ok')">Confirm</ix-button>
</ix-modal-footer>
