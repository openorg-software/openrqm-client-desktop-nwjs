<ix-modal-header>Register</ix-modal-header>

<ix-modal-content>
  <div class="mb-3">
    <label class="form-label">E Mail</label>
    <input class="form-control" #emailRegister>
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input class="form-control" type="password" #passwordRegister>
  </div>
  <div class="mb-3">
    <label class="form-label">Repeat Password</label>
    <input class="form-control" type="password" #passwordAgainRegister>
  </div>
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input class="form-control" #nameRegister>
  </div>
  <div class="mb-3">
    <label class="form-label">Surname</label>
    <input class="form-control" #surnameRegister>
  </div>
  <div class="mb-3">
    <label class="form-label">Department</label>
    <input class="form-control" #departmentRegister>
  </div>
</ix-modal-content>

<ix-modal-footer>
  <ix-button variant="subtle-primary" (click)="activeModal.dismiss('cancel')">Cancel</ix-button>
  <ix-button (click)="register(); activeModal.close('ok')">Register</ix-button>
</ix-modal-footer>
