<ix-application-header name="OpenRQM">
  <div slot="logo"><img src="assets/img/logo_transparent.png"></div>
  <ix-button id="wsFileMenuTrigger" variant="subtle-primary">File</ix-button>
  <ix-dropdown trigger="wsFileMenuTrigger">
    <ix-dropdown-item label="New Workspace" (click)="openDialogNewWorkspace()"></ix-dropdown-item>
  </ix-dropdown>
  <ix-button variant="subtle-primary" (click)="openDialogManageAccessGroups()">Access Groups</ix-button>
  <span class="menu-spacer"></span>
  <ix-button id="wsSettingsMenuTrigger" variant="subtle-primary">Settings</ix-button>
  <ix-dropdown trigger="wsSettingsMenuTrigger">
    <ix-dropdown-item label="Server" (click)="openDialogServerSettings()"></ix-dropdown-item>
    <ix-dropdown-item label="User" (click)="openDialogUserSettings()"></ix-dropdown-item>
    <ix-dropdown-item label="Logout" (click)="logout()" routerLink="/login" routerLinkActive="active"></ix-dropdown-item>
  </ix-dropdown>
</ix-application-header>
