<ix-application-header name="OpenRQM">
  <div slot="logo"><img src="assets/img/logo_transparent.png"></div>
  <ix-icon-button icon="arrow-left" variant="tertiary" routerLink="/workspace-tree" routerLinkActive="active"></ix-icon-button>
  <ix-button variant="subtle-primary" (click)="openDialogDocumentTheme()">Theme</ix-button>
  <ix-button id="docExportMenuTrigger" variant="subtle-primary">Export</ix-button>
  <ix-dropdown trigger="docExportMenuTrigger">
    <ix-dropdown-item label="PDF" (click)="openDialogExportModalPDF()"></ix-dropdown-item>
    <ix-dropdown-item label="Markdown" (click)="openDialogExportModalMarkdown()"></ix-dropdown-item>
    <ix-dropdown-item label="Raw" (click)="openDialogExportModalRaw()"></ix-dropdown-item>
  </ix-dropdown>
  <ix-button variant="subtle-primary">Review</ix-button>
  <ix-button id="docLinkMenuTrigger" variant="subtle-primary">Links</ix-button>
  <ix-dropdown trigger="docLinkMenuTrigger">
    <ix-dropdown-item *ngIf="!linkingInProgress" label="Start Linking" (click)="startLinking()"></ix-dropdown-item>
    <ix-dropdown-item *ngIf="linkingInProgress" label="Stop Linking" (click)="stopLinking()"></ix-dropdown-item>
    <ix-dropdown-item label="Tracing"></ix-dropdown-item>
  </ix-dropdown>

  <span class="menu-spacer"></span>
  <ix-button id="docSettingsMenuTrigger" variant="subtle-primary">Settings</ix-button>
  <ix-dropdown trigger="docSettingsMenuTrigger">
    <ix-dropdown-item label="Server" (click)="openDialogServerSettings()"></ix-dropdown-item>
    <ix-dropdown-item label="User" (click)="openDialogUserSettings()"></ix-dropdown-item>
    <ix-dropdown-item label="Logout" (click)="logout()" routerLink="/login" routerLinkActive="active"></ix-dropdown-item>
  </ix-dropdown>
</ix-application-header>
