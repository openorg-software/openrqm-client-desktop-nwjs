<ix-modal-header *ngIf="item.isItemDocument()">Document Properties</ix-modal-header>
<ix-modal-header *ngIf="item.isItemWorkspace()">Workspace Properties</ix-modal-header>

<ix-modal-content>
  <!-- If a document is viewed-->
  <div class="grid-container">
    <div class="grid-left">
      <div *ngIf=" item.isItemDocument()">
        <div class="mb-3">
          <label class="form-label">Document Name</label>
          <input class="form-control" #documentName>
        </div>
        <div class="mb-3">
          <label class="form-label">Workspace</label>
          <input class="form-control" #workspaceId>
        </div>
        <div class="mb-3">
          <label class="form-label">Short Name</label>
          <input class="form-control" #shortName>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <input class="form-control" #description>
        </div>
        <div class="mb-3">
          <label class="form-label">Confidentiality</label>
          <input class="form-control" #confidentiality>
        </div>
        <div class="mb-3">
          <label class="form-label">Author</label>
          <input class="form-control" type="number" #authorId>
        </div>
        <div class="mb-3">
          <label class="form-label">Reviewer</label>
          <input class="form-control" type="text" #reviewerText>
        </div>
        <div class="mb-3">
          <label class="form-label">Approver</label>
          <input class="form-control" type="number" #approverId>
        </div>
        <div class="mb-3">
          <label class="form-label">Language</label>
          <input class="form-control" type="number" #languageId>
        </div>
        <div class="mb-3">
          <label class="form-label">External Identifier</label>
          <input class="form-control" #externalIdentifier>
        </div>
      </div>
      <!-- If a workspace is viewed-->
      <div *ngIf=" item.isItemWorkspace()">
        <div class="mb-3">
          <label class="form-label">Workspace Id: {{item.value}}</label>
        </div>
        <div class="mb-3">
          <label class="form-label">Workspace Name</label>
          <input class="form-control" #workspaceName>
        </div>
        <div class="mb-3">
          <label class="form-label">Parent Workspace</label>
          <input class="form-control" #parentWorkspace>
        </div>
      </div>
    </div>
    <div class="grid-right">
      <app-rqmaccess-control-list *ngIf=" item.isItemWorkspace()" [workspaceId]=item.value></app-rqmaccess-control-list>
    </div>
  </div>
</ix-modal-content>

<ix-modal-footer>
  <ix-button variant="subtle-primary" (click)="activeModal.dismiss('cancel')">Cancel</ix-button>
  <ix-button *ngIf=" item.isItemDocument()" (click)="updateDocument()">Update Document</ix-button>
  <ix-button *ngIf=" item.isItemWorkspace()" (click)="updateWorkspace()">Update Workspace</ix-button>
</ix-modal-footer>
