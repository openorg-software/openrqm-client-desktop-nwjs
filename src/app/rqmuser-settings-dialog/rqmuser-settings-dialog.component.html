<ix-modal-header>User Settings</ix-modal-header>
<ix-modal-content>
  <div class="mb-3">
    <label class="form-label">E Mail</label>
    <input class="form-control" #emailRegister>
  </div>
  <div class="mb-3">
    <label class="form-label">Old password</label>
    <input type="password" autocomplete="current-password" class="form-control" #oldPassword>
  </div>
  <div class="mb-3">
    <label class="form-label">New password</label>
    <input type="password" class="form-control" #newPassword>
  </div>
  <div class="mb-3">
    <label class="form-label">Repeat new password</label>
    <input type="password" class="form-control" #newPasswordAgain>
  </div>
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input class="form-control" #nameRegister>
  </div>
  <div class="mb-3">
    <label class="form-label">Surname</label>
    <input class="form-control" #surnameRegister>
  </div>
  <div class="mb-3">
    <label class="form-label">Department</label>
    <input class="form-control" #departmentRegister>
  </div>
</ix-modal-content>
<ix-modal-footer>
  <ix-button variant="subtle-primary" (click)="activeModal.dismiss('cancel')">Cancel</ix-button>
  <ix-button (click)="updateUser(); activeModal.close('updated')">Update</ix-button>
</ix-modal-footer>
