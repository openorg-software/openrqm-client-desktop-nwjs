<ix-modal-header>Server Settings</ix-modal-header>

<ix-modal-content>
  <div class="mb-3">
    <label class="form-label">Server URL</label>
    <input class="form-control" #serverUrlInputField value="{{serverUrl}}">
  </div>
</ix-modal-content>

<ix-modal-footer>
  <span>v{{version}}</span>
  <ix-button variant="subtle-primary" (click)="activeModal.dismiss('cancel')">Cancel</ix-button>
  <ix-button (click)="saveSettings(); activeModal.close('ok')">Save</ix-button>
</ix-modal-footer>
