<ix-modal-header>Theme</ix-modal-header>

<ix-modal-content>
  <div class="mb-3">
    <label class="form-label">Requirement Color</label>
    <input class="form-control" #requirementColor value="{{reqColor}}">
  </div>
  <div class="mb-3">
    <label class="form-label">Prose Color</label>
    <input class="form-control" #proseColor value="{{proColor}}">
  </div>
</ix-modal-content>

<ix-modal-footer>
  <ix-button variant="subtle-primary" (click)="activeModal.dismiss('cancel')">Cancel</ix-button>
  <ix-button (click)="saveTheme(); activeModal.close('saved')">Save</ix-button>
</ix-modal-footer>
