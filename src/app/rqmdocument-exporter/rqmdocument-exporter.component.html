<ix-modal-header *ngIf="exportType=='pdf'">Export PDF</ix-modal-header>
<ix-modal-header *ngIf="exportType=='markdown'">Export Markdown</ix-modal-header>
<ix-modal-header *ngIf="exportType=='raw'">Export Raw</ix-modal-header>

<ix-modal-content>
  <div class="mb-3">
    <label class="form-label">Exported file name</label>
    <input class="form-control" #exportFileName>
  </div>
  <div class="mb-3" *ngIf="exportType != 'raw'">
    <label class="form-label">Template</label>
    <select class="form-select" [(ngModel)]="selectedTemplate">
      <option *ngFor="let template of templates" [ngValue]="template.id">{{template.name}}</option>
    </select>
  </div>
</ix-modal-content>

<ix-modal-footer>
  <ix-button variant="subtle-primary" (click)="activeModal.dismiss('cancel')">Cancel</ix-button>
  <ix-button (click)="exportDocument(); activeModal.close('export')">Export</ix-button>
</ix-modal-footer>
