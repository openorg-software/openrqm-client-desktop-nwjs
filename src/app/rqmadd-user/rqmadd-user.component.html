<ix-modal-header>Add User</ix-modal-header>
<ix-modal-content>
  <div class="mb-3">
    <label class="form-label">User Id</label>
    <select class="form-select" [(ngModel)]="selectedUser">
      <option *ngFor="let user of userInfos" [ngValue]="user">{{user.email}}</option>
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Permissions</label>
    <input class="form-control" #permissions type="number">
  </div>
</ix-modal-content>

<ix-modal-footer>
  <ix-button variant="subtle-primary" (click)="activeModal.dismiss('cancel')">Cancel</ix-button>
  <ix-button (click)="addUser()">Add</ix-button>
</ix-modal-footer>
