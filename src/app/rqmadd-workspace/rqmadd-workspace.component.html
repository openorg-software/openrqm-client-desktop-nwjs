<ix-modal-header>Add Workspace</ix-modal-header>

<ix-modal-content>
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input class="form-control" #workspaceName>
  </div>
  <div class="mb-3">
    <label class="form-label">Parent ID: {{parentName}}</label>
  </div>
</ix-modal-content>

<ix-modal-footer>
  <ix-button variant="subtle-primary" (click)="activeModal.dismiss('cancel')">Cancel</ix-button>
  <ix-button (click)="addWorkspace(); activeModal.close('ok')">Add</ix-button>
</ix-modal-footer>
