<ix-modal-header>Import Document</ix-modal-header>

<ix-modal-content>
  <div class="mb-3">
    <label class="form-label">Workspace: {{parentId}}</label>
  </div>
  <div class="mb-3">
    <label class="form-label">Select file for import</label>
    <input #importFile class="form-control" type="file">
  </div>
</ix-modal-content>

<ix-modal-footer>
  <ix-button variant="subtle-primary" (click)="activeModal.dismiss('cancel')">Cancel</ix-button>
  <ix-button (click)="importDocument()">Import</ix-button>
</ix-modal-footer>
