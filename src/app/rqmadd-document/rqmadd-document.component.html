<ix-modal-header>Add Document</ix-modal-header>

<ix-modal-content>
  <div class="mb-3">
    <label class="form-label">Document Name</label>
    <input class="form-control" #documentName>
  </div>
  <div class="mb-3">
    <label class="form-label">Workspace: {{parentId}}</label>
  </div>
  <div class="mb-3">
    <label class="form-label">Short Name</label>
    <input class="form-control" #shortName>
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <input class="form-control" #description>
  </div>
  <div class="mb-3">
    <label class="form-label">Confidentiality</label>
    <input class="form-control" #confidentiality>
  </div>
  <div class="mb-3">
    <label class="form-label">Author</label>
    <input class="form-control" type="number" #authorId>
  </div>
  <div class="mb-3">
    <label class="form-label">Reviewer</label>
    <input class="form-control" type="text" #reviewerText>
  </div>
  <div class="mb-3">
    <label class="form-label">Approver</label>
    <input class="form-control" type="number" #approverId>
  </div>
  <div class="mb-3">
    <label class="form-label">Language</label>
    <input class="form-control" type="number" #languageId>
  </div>
  <div class="mb-3">
    <label class="form-label">External Identifier</label>
    <input class="form-control" #externalIdentifier>
  </div>
</ix-modal-content>

<ix-modal-footer>
  <ix-button variant="subtle-primary" (click)="activeModal.dismiss('cancel')">Cancel</ix-button>
  <ix-button (click)="addDocument(); activeModal.close('ok')">Add</ix-button>
</ix-modal-footer>
